name: PR Notifications to Slack

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
    branches:
      - main
      - develop

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Save Slack user map
        run: echo '${{ secrets.SLACK_USER_MAP }}' > usermap.json

      # --- READY ---
      - name: Notify PR Ready
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, 'ready')
        run: |
          build_mentions() {
            mentions=""
            for u in "$@"; do
              [ -z "$u" ] && continue
              case "$u" in
                channel|here|everyone)
                  mentions="$mentions @$u"
                  continue
                  ;;
              esac
              slack_id=$(jq -r --arg user "$u" '.[$user]' usermap.json)
              if [ "$slack_id" != "null" ] && [ -n "$slack_id" ]; then
                mentions="$mentions <@$slack_id>"
              else
                mentions="$mentions @$u"
              fi
            done
            echo "$mentions" | xargs -r
          }

          body="${{ github.event.comment.body }}"
          reviewers=$(echo "$body" | grep -o '@[a-zA-Z0-9._-]\+' | tr -d '@' || true)
          reviewers_mentions=$(build_mentions $reviewers)
          author_mention=$(build_mentions ${{ github.event.comment.user.login }})
          pr_num=${{ github.event.issue.number }}

          curl -s -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json' \
            --data "{
              \"channel\": \"${SLACK_CHANNEL_ID}\",
              \"text\": \"🟢 PR Ready for Review\",
              \"blocks\": [
                { \"type\": \"header\", \"text\": { \"type\": \"plain_text\", \"text\": \"🟢 PR Ready for Review\" } },
                { \"type\": \"section\", \"text\": { \"type\": \"mrkdwn\", \"text\": \"*PR #${pr_num}*\n*Title:* ${{ github.event.issue.title }}\" } },
                { \"type\": \"section\", \"fields\": [
                    { \"type\": \"mrkdwn\", \"text\": \"👤 *Author:*\\n$author_mention\" },
                    { \"type\": \"mrkdwn\", \"text\": \"👥 *Reviewers:*\\n$reviewers_mentions\" }
                  ]
                },
                { \"type\": \"actions\", \"elements\": [
                    { \"type\": \"button\", \"text\": { \"type\": \"plain_text\", \"text\": \"View PR\" }, \"url\": \"${{ github.event.issue.html_url }}\" }
                  ]
                }
              ]
            }" https://slack.com/api/chat.postMessage
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      # --- COMMENTED ---
      - name: Notify Reviewer Feedback
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, 'commented')
        run: |
          build_mentions_unique() {
            seen=""
            out=""
            for u in "$@"; do
              [ -z "$u" ] && continue
              if echo " $seen " | grep -qw "$u"; then
                continue
              fi
              seen="$seen $u"
              case "$u" in
                channel|here|everyone)
                  out="$out @$u"
                  ;;
                *)
                  slack_id=$(jq -r --arg user "$u" '.[$user]' usermap.json)
                  if [ "$slack_id" != "null" ] && [ -n "$slack_id" ]; then
                    out="$out <@$slack_id>"
                  else
                    out="$out @$u"
                  fi
                  ;;
              esac
            done
            echo "$out" | xargs -r
          }

          map_mentions_in_text() {
            text="$1"
            for h in $(echo "$text" | grep -o '@[a-zA-Z0-9._-]\+' | tr -d '@' | sort -u); do
              sid=$(jq -r --arg user "$h" '.[$user]' usermap.json)
              if [ "$sid" != "null" ] && [ -n "$sid" ]; then
                text=$(echo "$text" | sed -E "s/@$h/<@$sid>/g")
              fi
            done
            echo "$text"
          }

          body_raw="${{ github.event.comment.body }}"
          body_content=$(echo "$body_raw" | sed -E 's/^commented[[:space:]]*//')

          pr_author="${{ github.event.issue.user.login }}"
          reviewer="${{ github.event.comment.user.login }}"
          
          involving_mentions=$(build_mentions_unique "$pr_author" "$reviewer")
          reviewer_mention=$(build_mentions_unique "$reviewer")

          pr_num=${{ github.event.issue.number }}

          body_trimmed=$(echo "$body_content" | xargs -r || echo "")
          blocks=""
          
          if [ -n "$body_trimmed" ]; then
            body_mapped=$(map_mentions_in_text "$body_trimmed")
            body_escaped=$(echo "$body_mapped" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            blocks="
                { \"type\": \"section\", \"text\": { \"type\": \"mrkdwn\", \"text\": \"> ${body_escaped}\" } },
            "
          fi

          curl -s -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json' \
            --data "{
              \"channel\": \"${SLACK_CHANNEL_ID}\",
              \"text\": \"💬 Reviewer Comment by $reviewer_mention\",
              \"blocks\": [
                { \"type\": \"header\", \"text\": { \"type\": \"plain_text\", \"text\": \"💬 Reviewer Comment by $reviewer_mention\" } },
                { \"type\": \"section\", \"text\": { \"type\": \"mrkdwn\", \"text\": \"*PR #${pr_num}*\" } },${blocks}
                { \"type\": \"section\", \"text\": { \"type\": \"mrkdwn\", \"text\": \"👥 *Involving:* $involving_mentions\" } },
                { \"type\": \"actions\", \"elements\": [
                    { \"type\": \"button\", \"text\": { \"type\": \"plain_text\", \"text\": \"View Comment\" }, \"url\": \"${{ github.event.comment.html_url }}\" }
                  ]
                }
              ]
            }" https://slack.com/api/chat.postMessage
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- MERGED ---
      - name: Notify Merge
        if: github.event.pull_request.merged == true
        run: |
          build_mentions() {
            mentions=""
            for u in "$@"; do
              [ -z "$u" ] && continue
              slack_id=$(jq -r --arg user "$u" '.[$user]' usermap.json)
              if [ "$slack_id" != "null" ] && [ -n "$slack_id" ]; then
                mentions="$mentions <@$slack_id>"
              else
                mentions="$mentions @$u"
              fi
            done
            echo "$mentions" | xargs -r
          }

          pr_author="${{ github.event.pull_request.user.login }}"
          merger="${{ github.event.pull_request.merged_by.login }}"
          author_mention=$(build_mentions "$pr_author")
          merger_mention=$(build_mentions "$merger")
          pr_num=${{ github.event.pull_request.number }}
          base_branch="${{ github.event.pull_request.base.ref }}"

          curl -s -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json' \
            --data "{
              \"channel\": \"${SLACK_CHANNEL_ID}\",
              \"text\": \"✅ PR Merged Successfully! <!channel>\",
              \"blocks\": [
                { \"type\": \"header\", \"text\": { \"type\": \"plain_text\", \"text\": \"✅ PR Merged Successfully!\" } },
                { \"type\": \"section\", \"text\": { \"type\": \"mrkdwn\", \"text\": \"*PR #${pr_num}*\n*Title:* ${{ github.event.pull_request.title }}\n*Merged into:* \`${base_branch}\`\" } },
                { \"type\": \"section\", \"fields\": [
                    { \"type\": \"mrkdwn\", \"text\": \"👤 *Author:*\\n$author_mention\" },
                    { \"type\": \"mrkdwn\", \"text\": \"🔀 *Merged by:*\\n$merger_mention\" }
                  ]
                },
                { \"type\": \"section\", \"text\": { \"type\": \"mrkdwn\", \"text\": \"🎉 Great work team!\" } },
                { \"type\": \"actions\", \"elements\": [
                    { \"type\": \"button\", \"text\": { \"type\": \"plain_text\", \"text\": \"View PR\" }, \"url\": \"${{ github.event.pull_request.html_url }}\" }
                  ]
                }
              ]
            }" https://slack.com/api/chat.postMessage
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}